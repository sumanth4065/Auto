name: Auto Efnol Anon ADA Scan
 
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose Environment to Run Sanity'
        required: true
        default: 'uat1'
        type: choice
        options:
          - uat1
          - uat2
          - qa1
          - qa2
      firstname:
        description: 'First Name'
        default: 'RAJAPANDIA'
        type: string
      lastname:
        description: 'Last Name'
        default: 'MULYANA'
        type: string
      policynumber:
        description: 'Policy Number'
        default: 'CHO019710006'
        type: string
      zipcode:
        description: 'Zip Code'
        default: '91384'
        type: string
 
  repository_dispatch:
    types: [AutoAnonAdaSanity]
 
env:
  PASSWORD: ${{secrets.QA_USER_PASSWORD}}
  USER_PROD: ${{secrets.USER_PROD}}
  OKTA_AUTHSERVER_ID_PROD: ${{secrets.OKTA_AUTHSERVER_ID_PROD}}
  OKTA_CLIENT_ID_PROD: ${{secrets.OKTA_CLIENT_ID_PROD}}
  OKTA_CLIENT_SECRET_PROD: ${{secrets.OKTA_CLIENT_SECRET_PROD}}
  QA_ENT_AXE_API_KEY: ${{secrets.QA_ENT_AXE_API_KEY}}
  QA_ISS_AXE_API_KEY: ${{secrets.QA_ISS_AXE_API_KEY}}
  QA_OKTA_APIKEY : ${{secrets.QA_OKTA_APIKEY}}
  ORG_ID: ${{secrets.QA_AXE_ORG_ID}}
  SLACK_TOKEN: ${{secrets.QA_SLACK_TOKEN}}
  #NPM_TOKEN: ${{ secrets.GH_TEAMS_TOKEN }}
  ENTERPRISE_NPM_TOKEN: ${{secrets.ENTERPRISE_NPM_TOKEN}}
  NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  AXE_TOKEN: ${{ secrets.QA_ENT_AXE_TOKEN  }}
 
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./tests/ada
 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
 
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
 
      - name: Install dependencies using a safe clean install
        run: npm install
 
      - name: Install Playwright
        run: npx playwright install  
              
      - name: Run Sanity Tests in UAT1 for ADA
        if: ${{ github.event.inputs.environment == 'uat1' }}
        run: |
          npm run auto-efnol-anon-ada-uat1
        env:
          TEST_FIRSTNAME: ${{ github.event.inputs.firstname }}
          TEST_LASTNAME: ${{ github.event.inputs.lastname }}
          TEST_POLICYNUMBER: ${{ github.event.inputs.policynumber }}
          TEST_ZIPCODE: ${{ github.event.inputs.zipcode }}
          
      - name: Run Sanity Tests in UAT2 for GW  - Regression
        if: ${{ github.event.inputs.environment == 'uat2' }}
        run: |
          npm run auto-efnol-anon-ada-uat2
        env:
          TEST_FIRSTNAME: ${{ github.event.inputs.firstname }}
          TEST_LASTNAME: ${{ github.event.inputs.lastname }}
          TEST_POLICYNUMBER: ${{ github.event.inputs.policynumber }}
          TEST_ZIPCODE: ${{ github.event.inputs.zipcode }}

      - name: Run Sanity Tests in QA1 for ADA
        if: ${{ github.event.inputs.environment == 'qa1' }}
        run: |
          npm run auto-efnol-anon-ada-qa1
        env:
          TEST_FIRSTNAME: ${{ github.event.inputs.firstname }}
          TEST_LASTNAME: ${{ github.event.inputs.lastname }}
          TEST_POLICYNUMBER: ${{ github.event.inputs.policynumber }}
          TEST_ZIPCODE: ${{ github.event.inputs.zipcode }}
          
      - name: Run Sanity Tests in QA2 for ADA
        if: ${{ github.event.inputs.environment == 'qa2' }}
        run: |
          npm run auto-efnol-anon-ada-qa2
        env:
          TEST_FIRSTNAME: ${{ github.event.inputs.firstname }}
          TEST_LASTNAME: ${{ github.event.inputs.lastname }}
          TEST_POLICYNUMBER: ${{ github.event.inputs.policynumber }}
          TEST_ZIPCODE: ${{ github.event.inputs.zipcode }}
    
      - name: Send AXE Reports to Server  
        run: |
          npm run sendscan
          npm run clean
        env:
          AXE_ORGANIZATION: ${{ secrets.QA_AXE_ORG_ID }}
 
      - name: Upload Change Finance ADA test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: tests/ada/htmlreports/
          retention-days: 14