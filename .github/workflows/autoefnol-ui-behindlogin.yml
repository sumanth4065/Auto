name: Sanity test for Auto eFNOL Behind Login - UI

on:
  schedule:
    - cron: '0 4 * * 2,4' # Tuesday & Thursday 04:00 UTC
  workflow_dispatch:
    inputs:
      env:  
        description: 'Select an environment to run Sanity'
        required: true
        default: 'uat1'
        type: choice 
        options:
          - qa1
          - qa2
          - uat1
          - uat2
      policytype:
        description: 'Choose Policy Type to Run Sanity'
        required: true
        default: 'HUON'
        type: choice
        options:
          - HUON
          - GW    
      state:   
        description: 'Select a state to Run Sanity'
        required: true
        default: 'CA'
        type: string
      username:
        description: 'Username for selected state'
        default: '004_28367878@aaa.com'
        type: string
      policynumber:
        description: 'Policy number (required for GW only)'
        required: false
        default: 'CAA027471203'
        type: string
      existingClaimDate:
        description: 'Existing Claim Date'
        required: true
        default: '05/21/2026'
        type: string
  repository_dispatch:
    types: eFNOLAutoUI-sanity-bl

env:
  PASSWORD: ${{secrets.QA_USER_PASSWORD}}
  USER_PROD: ${{secrets.USER_PROD}}
  OKTA_AUTHSERVER_ID_PROD: ${{secrets.OKTA_AUTHSERVER_ID_PROD}}
  OKTA_CLIENT_ID_PROD: ${{secrets.OKTA_CLIENT_ID_PROD}}
  OKTA_CLIENT_SECRET_PROD: ${{secrets.OKTA_CLIENT_SECRET_PROD}}
  OKTA_CLIENT_ID: ${{secrets.OKTA_CLIENT_ID}}
  OKTA_CLIENT_SECRET: ${{secrets.OKTA_CLIENT_SECRET}}
  QA_ENT_AXE_API_KEY: ${{secrets.QA_ENT_AXE_API_KEY}}
  ORG_ID: ${{secrets.QA_AXE_ORG_ID}}
  SLACK_TOKEN: ${{secrets.QA_SLACK_TOKEN}}
  NPM_TOKEN: ${{ secrets.GH_TEAMS_TOKEN }}
  ENTERPRISE_NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  AXE_TOKEN: ${{ secrets.QA_ENT_AXE_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./tests/ui

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies using a safe clean install
        run: npm install

      - name: Install Playwright
        run: npx playwright install

      - name: Pull common test data from qa-automation-common
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
          SRC_REPO: ACE-Clublabs/qa-automation-common
          SRC_WORKFLOW: Test Data Pull
          DEST: testdata/common
        run: |
          set -euo pipefail
          mkdir -p "$DEST"
          run_ids=$(gh run list --repo "$SRC_REPO" --workflow "$SRC_WORKFLOW" \
            --limit 15 --json databaseId --jq '.[].databaseId')
          if [ -z "$run_ids" ]; then
            echo "::error::No successful '$SRC_WORKFLOW' runs found in $SRC_REPO"; exit 1
          fi
          found=""
          for rid in $run_ids; do
            echo "Trying Test Data Pull run $rid ..."
            rm -rf "${DEST:?}/"* || true
            if gh run download "$rid" --repo "$SRC_REPO" --dir "$DEST" >/dev/null 2>&1; then
              if find "$DEST" -type f -path '*/products/autoHuon.json' | grep -q . \
                 || find "$DEST" -type f -path '*/products/autoGw.json' | grep -q .; then
                echo "Using run $rid (products/ present)."
                echo "Artifact(s) pulled from run $rid:"
                ls -1 "$DEST"
                found="$rid"; break
              fi
              echo "Run $rid downloaded but has no products/ folder; trying next."
            else
              echo "No downloadable artifact for run $rid; trying next."
            fi
          done
          if [ -z "$found" ]; then
            echo "::error::No recent Test Data Pull artifact contained products/. Aborting."; exit 1
          fi

      - name: Sanity Test eFNOL UI Auto in huon QA1
        if: ${{ github.event.inputs.env == 'qa1' && github.event.inputs.policytype == 'HUON'}}
        run: npm run sanity-eFNOLUI-auto-with-login-huon-qa1
        env:
          TEST_USERNAME: ${{ github.event.inputs.username }}
          STATE_INPUT: ${{ github.event.inputs.state }}
          MYACT_PASSWORD: ${{secrets.QA_USER_PASSWORD}}
          TEST_EXISTINGCLAIM: ${{github.event.inputs.existingClaimDate}}

      - name: Sanity Test eFNOL UI Auto in huon QA2
        if: ${{ github.event.inputs.env == 'qa2' && github.event.inputs.policytype == 'HUON'}}
        run: npm run sanity-eFNOLUI-auto-with-login-huon-qa2
        env:
          TEST_USERNAME: ${{ github.event.inputs.username }}
          STATE_INPUT: ${{ github.event.inputs.state }}
          MYACT_PASSWORD: ${{secrets.QA_USER_PASSWORD}}
          TEST_EXISTINGCLAIM: ${{github.event.inputs.existingClaimDate}}

      - name: Sanity Test eFNOL UI Auto in huon UAT1
        if: ${{ github.event.inputs.env == 'uat1' && github.event.inputs.policytype == 'HUON' }}
        run: npm run sanity-eFNOLUI-auto-with-login-huon-uat1
        env:
          TEST_USERNAME: ${{ github.event.inputs.username }}
          STATE_INPUT: ${{ github.event.inputs.state }}
          MYACT_PASSWORD: ${{secrets.QA_USER_PASSWORD}}
          TEST_EXISTINGCLAIM: ${{github.event.inputs.existingClaimDate}}

      - name: Sanity Test eFNOL UI Auto in huon UAT2
        if: ${{ github.event.inputs.env == 'uat2' && github.event.inputs.policytype == 'HUON'}}
        run: npm run sanity-eFNOLUI-auto-with-login-huon-uat2
        env:
          TEST_USERNAME: ${{ github.event.inputs.username }}
          STATE_INPUT: ${{ github.event.inputs.state }}
          MYACT_PASSWORD: ${{secrets.QA_USER_PASSWORD}}
          TEST_EXISTINGCLAIM: ${{github.event.inputs.existingClaimDate}}

      - name: Sanity Test eFNOL UI Auto in gw QA1
        if: ${{ github.event.inputs.env == 'qa1' && github.event.inputs.policytype == 'GW'}}
        run: npm run sanity-eFNOLUI-auto-with-login-gw-qa1
        env:
          TEST_USERNAME: ${{ github.event.inputs.username }}
          STATE_INPUT: ${{ github.event.inputs.state }}
          MYACT_PASSWORD: ${{secrets.QA_USER_PASSWORD}}
          TEST_POLICYNUMBER: ${{ github.event.inputs.policynumber }}
          TEST_EXISTINGCLAIM: ${{github.event.inputs.existingClaimDate}}

      - name: Sanity Test eFNOL UI Auto in gw QA2
        if: ${{ github.event.inputs.env == 'qa2' && github.event.inputs.policytype == 'GW'}}
        run: npm run sanity-eFNOLUI-auto-with-login-gw-qa2
        env:
          TEST_USERNAME: ${{ github.event.inputs.username }}
          STATE_INPUT: ${{ github.event.inputs.state }}
          MYACT_PASSWORD: ${{secrets.QA_USER_PASSWORD}}
          TEST_POLICYNUMBER: ${{ github.event.inputs.policynumber }}
          TEST_EXISTINGCLAIM: ${{github.event.inputs.existingClaimDate}}

      - name: Sanity Test eFNOL UI Auto in gw UAT1
        if: ${{ github.event.inputs.env == 'uat1' && github.event.inputs.policytype == 'GW'}}
        run: npm run sanity-eFNOLUI-auto-with-login-gw-uat1
        env:
          TEST_USERNAME: ${{ github.event.inputs.username }}
          STATE_INPUT: ${{ github.event.inputs.state }}
          MYACT_PASSWORD: ${{secrets.QA_USER_PASSWORD}}
          TEST_POLICYNUMBER: ${{ github.event.inputs.policynumber }}
          TEST_EXISTINGCLAIM: ${{github.event.inputs.existingClaimDate}}

      - name: Sanity Test eFNOL UI Auto in gw UAT2
        if: ${{ github.event.inputs.env == 'uat2' && github.event.inputs.policytype == 'GW'}}
        run: npm run sanity-eFNOLUI-auto-with-login-gw-uat2
        env:
          TEST_USERNAME: ${{ github.event.inputs.username }}
          STATE_INPUT: ${{ github.event.inputs.state }}
          MYACT_PASSWORD: ${{secrets.QA_USER_PASSWORD}}
          TEST_POLICYNUMBER: ${{ github.event.inputs.policynumber }}
          TEST_EXISTINGCLAIM: ${{github.event.inputs.existingClaimDate}}

      - name: Scheduled Sanity - HUON UAT1
        if: ${{ github.event_name == 'schedule' }}
        run: npm run sanity-eFNOLUI-auto-with-login-huon-uat1
        env:
          STATE_INPUT: CA
          MYACT_PASSWORD: ${{secrets.QA_USER_PASSWORD}}
          TEST_EXISTINGCLAIM: '05/21/2026'

      - name: Upload eFNOL UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/ui/htmlreports/
          retention-days: 14
