# .github/workflows/claude-plugin-check.yml
name: Claude Plugin Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx @ace-clublabs/claude-plugin status
        env:
          ENTERPRISE_NPM_TOKEN: ${{ secrets.ENTERPRISE_NPM_TOKEN }}
