name: Sanity test for Auto eFNOL - API

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Select an environment to run Sanity'
        required: true
        default: 'uat1'
        type: choice
        options:
          - uat1
          - uat2
          - qa1
          - qa2
      state:
        description: 'Select a state to Run Sanity'
        required: true
        default: 'MO'
        type: string
      username:
        description: 'Username for selected state'
        default: '065_36609988@aaa.com'
        type: string
      policynumber:
        description: 'Policynumber for selected username'
        default: 'AMO000130601'
        type: string

  repository_dispatch:
    types: eFNOLAutoAPI-sanity

env:
  PASSWORD: ${{secrets.QA_USER_PASSWORD}}
  USER_PROD: ${{secrets.USER_PROD}}
  OKTA_AUTHSERVER_ID_PROD: ${{secrets.OKTA_AUTHSERVER_ID_PROD}}
  OKTA_CLIENT_ID_PROD: ${{secrets.OKTA_CLIENT_ID_PROD}}
  OKTA_CLIENT_SECRET_PROD: ${{secrets.OKTA_CLIENT_SECRET_PROD}}
  QA_ENT_AXE_API_KEY: ${{secrets.QA_ENT_AXE_API_KEY}}
  QA_OKTA_APIKEY : ${{secrets.QA_OKTA_APIKEY}}
  ORG_ID: ${{secrets.QA_AXE_ORG_ID}}
  SLACK_TOKEN: ${{secrets.QA_SLACK_TOKEN}}
  NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ENTERPRISE_NPM_TOKEN: ${{ secrets.ENTERPRISE_NPM_TOKEN }}
  AXE_TOKEN: ${{ secrets.QA_ENT_AXE_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./tests/api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies using a safe clean install
        run: npm install

      - name: Install Playwright
        run: npx playwright install
        

      - name: Sanity Test Auto eFNOL API in QA1
        if: ${{ github.event.inputs.env == 'qa1' }}
        run: npm run regression-api-auto-withlogin-qa1
        env:
          TEST_USERNAME: ${{ github.event.inputs.username }}
          STATE_INPUT: ${{ github.event.inputs.state }}
          MYACT_PASSWORD: ${{secrets.QA_USER_PASSWORD}}
          TEST_POLICYNUMBER: ${{ github.event.inputs.policynumber }}

      - name: Sanity Test Auto eFNOL API in QA2
        if: ${{ github.event.inputs.env == 'qa2' }}
        run: npm run regression-api-auto-withlogin-qa2
        env:
          TEST_USERNAME: ${{ github.event.inputs.username }}
          STATE_INPUT: ${{ github.event.inputs.state }}
          MYACT_PASSWORD: ${{secrets.QA_USER_PASSWORD}}
          TEST_POLICYNUMBER: ${{ github.event.inputs.policynumber }}

      - name: Sanity Test Auto eFNOL API Auto in UAT1
        if: ${{ github.event.inputs.env == 'uat1' }}
        run: npm run regression-api-auto-withlogin-uat1
        env:
          TEST_USERNAME: ${{ github.event.inputs.username }}
          STATE_INPUT: ${{ github.event.inputs.state }}
          MYACT_PASSWORD: ${{secrets.QA_USER_PASSWORD}}
          TEST_POLICYNUMBER: ${{ github.event.inputs.policynumber }}

      - name: Sanity Test Auto eFNOL API Auto in UAT2
        if: ${{ github.event.inputs.env == 'uat2' }}
        run: npm run regression-api-auto-withlogin-uat2
        env:
          TEST_USERNAME: ${{ github.event.inputs.username }}
          STATE_INPUT: ${{ github.event.inputs.state }}
          MYACT_PASSWORD: ${{secrets.QA_USER_PASSWORD}}
          TEST_POLICYNUMBER: ${{ github.event.inputs.policynumber }}

      - name: Upload eFNOL API test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: tests/api/htmlreports/
          retention-days: 14
